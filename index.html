  SPanel.prototype.cell=function(part){
    var self=this,d;
    if(part.b!==undefined){
      d=document.createElement('span'); d.className='kblank';
      d.style.width=(String(part.b).length*0.62+0.82)+'em';
      this.blanks.push({v:part.b,el:d});
    }else{
      d=document.createElement('span'); d.className='kseg';
      this.text(d,part.s);
      if(part.id) this.seg[part.id]=d;
    }
    return d;
  };

  SPanel.prototype.reset=function(prob){
    var self=this;
    (this.timers||[]).forEach(clearTimeout); this.timers=[];
    CH.newProblem();
    this.prob=prob||seiGen();
    this.blanks=[]; this.bi=0; this.buf=''; this.seg={}; this.bai=null;
    this.sheet.innerHTML='';
    var P=this.prob,i;
    if(P.grid){
      var g=document.createElement('div'); g.className='sgrid';
      P.grid.r0.forEach(function(c){ g.appendChild(self.cell(c)); });
      for(i=0;i<5;i++){ var e=document.createElement('span'); e.className='sgapcell'; g.appendChild(e); }
      P.grid.r2.forEach(function(c){ g.appendChild(self.cell(c)); });
      this.sheet.appendChild(g); this.gridEl=g;
      /* □倍 */
      var w=document.createElement('span'); w.className='sbai';
      var d2=document.createElement('span'); d2.className='kblank';
      d2.style.width=(String(P.bai).length*0.62+0.82)+'em';
      w.appendChild(d2);
      var t2=document.createElement('span'); t2.textContent='倍'; w.appendChild(t2);
      this.sheet.appendChild(w); this.bai=w;
      this.blanks.unshift({v:P.bai,el:d2});
    }else{
      this.gridEl=null;
      P.lines.forEach(function(ln){
        var row=document.createElement('div'); row.className='kline';
        var body=document.createElement('span'); body.className='kbody';
        ln.p.forEach(function(part){ body.appendChild(self.cell(part)); });
        row.appendChild(body); self.sheet.appendChild(row);
      });
    }
    if(!this.hana){
      this.hana=document.createElement('img');
      this.hana.src=document.getElementById('hanamaruSrc').src;
      this.paper.appendChild(this.hana);
    }
    this.hana.className='khana';
    this.done=false;
    this.keypad.classList.remove('off');
    this.againBtn.classList.remove('on');
    this.focus();
    this.say(P.tip,'');
    this.layout();
  };

  SPanel.prototype.check=function(){
    if(this.buf==='') return;
    var self=this, b=this.blanks[this.bi];
    if(parseInt(this.buf,10)===b.v){
      b.el.textContent=String(b.v);
      b.el.classList.remove('now'); b.el.classList.add('ok');
      okBlip(); this.bi++; this.buf='';
      if(this.bi>=this.blanks.length){
        this.done=true; this.keypad.classList.add('off');
        this.say('せいかい！　'+this.prob.head,'good',true);
        var pw=this.paper.clientWidth, ph=this.paper.clientHeight;
        this.hana.style.width=(Math.min(pw,ph)*0.62)+'px';
        this.hana.style.left=(pw/2)+'px';
        this.hana.style.top=(ph/2)+'px';
        this.hana.className='khana show';
        pinponPlay();
        CH.done();
        this.timers.push(setTimeout(function(){self.hana.className='khana fade';},2000));
        if(!CH.stay()) this.timers.push(setTimeout(function(){self.reset();},3000));
      }else{ this.focus(); this.say(this.prob.tip,'good'); }
    }else{
      ngBlip(); CH.miss(); b.el.classList.add('ng');
      this.say('もう一度 考えてみよう。'+this.prob.tip,'bad');
      setTimeout(function(){b.el.classList.remove('ng');self.buf='';self.render();},460);
    }
  };

  /* ---- 矢印 ---- */
  SPanel.prototype.layer=function(){
    var sh=this.sheet, o=sh.querySelector('.karrow'); if(o) o.remove();
    var sv=document.createElementNS(SVGNS,'svg');
    sv.setAttribute('class','karrow');
    sv.setAttribute('viewBox','0 0 '+sh.offsetWidth+' '+sh.offsetHeight);
    sv.setAttribute('width',sh.offsetWidth); sv.setAttribute('height',sh.offsetHeight);
    sh.appendChild(sv); return sv;
  };
  function arrowHead(sv,px,py,fx,fy,col,t){
    var dx=px-fx,dy=py-fy,d=Math.sqrt(dx*dx+dy*dy)||1; dx/=d; dy/=d;
    var g=document.createElementNS(SVGNS,'polygon');
    g.setAttribute('points',px+','+py+' '+(px-dx*t-dy*t*0.55)+','+(py-dy*t+dx*t*0.55)+
      ' '+(px-dx*t+dy*t*0.55)+','+(py-dy*t-dx*t*0.55));
    g.setAttribute('fill',col); sv.appendChild(g);
  }
  function arc(sv,x1,y1,x2,y2,lift,h1,h2,col,wd,hs){
    var cx=(x1+x2)/2, cy=Math.min(y1,y2)-lift;
    var p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d','M'+x1+','+y1+' Q'+cx+','+cy+' '+x2+','+y2);
    p.setAttribute('fill','none'); p.setAttribute('stroke',col);
    p.setAttribute('stroke-width',wd||2.2); p.setAttribute('stroke-linecap','round');
    sv.appendChild(p);
    if(h2) arrowHead(sv,x2,y2,cx,cy,col,hs||8.5);
    if(h1) arrowHead(sv,x1,y1,cx,cy,col,hs||8.5);
  }
  SPanel.prototype.drawSwap=function(){
    var g=this.seg; if(!g.A||!g.B) return;
    var sv=this.layer(), RED='#e0362c';
    var x1=g.A.offsetLeft+g.A.offsetWidth/2, x2=g.B.offsetLeft+g.B.offsetWidth/2;
    var y=Math.min(g.A.offsetTop,g.B.offsetTop)-3;
    arc(sv,x1,y,x2,y,Math.max(26,(x2-x1)*0.5),true,true,RED);
  };
  SPanel.prototype.drawDist=function(){
    var g=this.seg; if(!g.A||!g.B||!g.M) return;
    var sv=this.layer(), RED='#e0362c';
    var ex=g.M.offsetLeft+2, ey=g.M.offsetTop-2;
    [[g.A,9],[g.B,0]].forEach(function(pr){
      var e=pr[0], sx=e.offsetLeft+e.offsetWidth*0.45, sy=e.offsetTop-2;
      arc(sv,sx,sy,ex,ey,Math.max(14,(ex-sx)*0.26)+pr[1],false,true,RED,1.7,6.5);
    });
  };
  /* 結合：右の（　）に まとまる 2つの 数を しめす */
  SPanel.prototype.drawGroup=function(){
    var g=this.seg, bl=this.blanks[0].el;
    if(!g.L1||!g.L2||!bl) return;
    var r1=(this.prob.t===2)?g.R1:bl, r2=(this.prob.t===2)?bl:g.R2;
    if(!r1||!r2) return;
    var sv=this.layer(), sh=this.sheet, RED='#e0362c';
    var row=g.L1; while(row&&row.parentNode!==sh) row=row.parentNode;
    var y=(row?row.offsetTop+row.offsetHeight:g.L1.offsetTop+g.L1.offsetHeight)+2;
    [[g.L1,g.L2],[r1,r2]].forEach(function(pr){
      var ln=document.createElementNS(SVGNS,'line');
      ln.setAttribute('x1',pr[0].offsetLeft-1); ln.setAttribute('y1',y);
      ln.setAttribute('x2',pr[1].offsetLeft+pr[1].offsetWidth+1); ln.setAttribute('y2',y);
      ln.setAttribute('stroke',RED); ln.setAttribute('stroke-width','2.1');
      ln.setAttribute('stroke-linecap','round');
      sv.appendChild(ln);
    });
  };
  SPanel.prototype.drawBai=function(){
    var g=this.seg; if(!g.B0||!g.B2||!g.P0||!this.bai||!this.gridEl) return;
    var sv=this.layer(), PUR='#b0468c';
    var pb=this.blanks[this.blanks.length-1].el;
    var pairs=[[g.B0,g.B2,'10倍'],[g.P0,pb,'']];
    if(this.prob.both) pairs.unshift([g.A0,g.A2,'10倍']);
    pairs.forEach(function(pr){
      var f=pr[0], t=pr[1];
      var x=f.offsetLeft+f.offsetWidth/2;            /* けたが そろって いるので 垂直 */
      var y1=f.offsetTop+f.offsetHeight+3, y2=t.offsetTop-3;
      var ln=document.createElementNS(SVGNS,'line');
      ln.setAttribute('x1',x);ln.setAttribute('y1',y1);
      ln.setAttribute('x2',x);ln.setAttribute('y2',y2-7);
      ln.setAttribute('stroke',PUR);ln.setAttribute('stroke-width','2.2');
      ln.setAttribute('stroke-linecap','round');
      sv.appendChild(ln);
      arrowHead(sv,x,y2,x,y2-12,PUR,8);
      if(pr[2]){
        var tx=document.createElementNS(SVGNS,'text');
        tx.setAttribute('x',x+8); tx.setAttribute('y',(y1+y2)/2+4);
        tx.setAttribute('font-size','13'); tx.setAttribute('fill',PUR);
        tx.textContent=pr[2]; sv.appendChild(tx);
      }
    });
    var px=pb.offsetLeft+pb.offsetWidth/2;
    this.bai.style.left=(px+22)+'px';
    this.bai.style.top=((g.P0.offsetTop+g.P0.offsetHeight+pb.offsetTop)/2-this.bai.offsetHeight/2)+'px';
  };

  SPanel.prototype.showHint=function(){
    if(this.done) return;
    var t=this.prob.t;
    if(t===0||t===1){ this.drawSwap(); this.say('2つの 数が 入れかわって いるね。','good'); }
    else if(t===4||t===5){ this.drawDist(); this.say('（　）の中の どちらにも、同じ数が かかるよ。','good'); }
    else if(t===2||t===3){ this.drawGroup(); this.say('赤い線の 2つが、右の（　）の中に まとまるよ。','good'); }
    else this.say(this.prob.tip,'good');
    this.layout();
  };

  };

  /* =========================================================
     考え方タブ ― ●の数の もとめ方（しき ⇄ 考え方の図）
     ========================================================= */
  var ZU=(function(){
    var z=null,qi=0,qOrder=[0,1,2];
    var figEl=document.getElementById('zuFig'),
        cardsEl=document.getElementById('zuCards'),
        totalEl=document.getElementById('zuTotal'),
        qEl=document.querySelector('.zu-q'),
        qBadge=document.getElementById('zuBadge'),

    var COL={a:{s:'#f2679b',f:'rgba(242,103,155,.22)'},
             b:{s:'#25a86e',f:'rgba(37,168,110,.22)'},
             c:{s:'#8a63d2',f:'rgba(138,99,210,.16)'},
             x:{s:'#c8262a',f:'rgba(200,38,42,.09)'}};
    var RED='#c8262a', DOT='#e8973a';

    /* ===== ① 長方形の かどを 欠いた 形 ===== */
    function figL(){
      var W,H,w,h,n=0;
      do{ W=ri(5,7); H=ri(4,5);
          w=ri(2,Math.min(4,W-2)); h=ri(2,Math.min(3,H-2)); n++;
      }while(n<60 && W===H && w===h);
      var fx=ri(0,1),fy=ri(0,1);
      function RX(x,rw){return fx?W-(x+rw):x;}
      function RY(y,rh){return fy?H-(y+rh):y;}
      var cells=[],x,y;
      for(y=0;y<H;y++){cells[y]=[];
        for(x=0;x<W;x++){
          var bx=fx?W-1-x:x, by=fy?H-1-y:y;
          cells[y][x]=!(bx>=W-w&&by>=H-h);
        }}
      return {W:W,H:H,cells:cells,total:W*H-w*h,E:[
        {exp:W+'×'+(H-h)+'＋'+(W-w)+'×'+h, name:'よこに 2つに 分ける',
         shapes:[{t:'rect',x:RX(0,W),y:RY(0,H-h),w:W,h:H-h,c:'a'},
                 {t:'rect',x:RX(0,W-w),y:RY(H-h,h),w:W-w,h:h,c:'b'}]},
        {exp:(W-w)+'×'+H+'＋'+w+'×'+(H-h), name:'たてに 2つに 分ける',
         shapes:[{t:'rect',x:RX(0,W-w),y:RY(0,H),w:W-w,h:H,c:'a'},
                 {t:'rect',x:RX(W-w,w),y:RY(0,H-h),w:w,h:H-h,c:'b'}]},
        {exp:W+'×'+H+'－'+w+'×'+h, name:'ぜんぶから ひく', ghostAll:true,
         shapes:[{t:'rect',x:0,y:0,w:W,h:H,c:'c'},
                 {t:'rect',x:RX(W-w,w),y:RY(H-h,h),w:w,h:h,c:'x'}]}
      ]};
    }

    /* ===== ② ひし形（だん／ななめ／動かして長方形） ===== */
    function figDia(kind,dir){
      var widths = (kind==='even')?[2,4,6,6,4,2]:[1,3,5,7,5,3,1];
      var W=(kind==='even')?6:7, H=widths.length, x,y,total=0;
      var cells=[];
      for(y=0;y<H;y++){cells[y]=[];
        var w0=widths[y], s0=(W-w0)/2;
        for(x=0;x<W;x++){cells[y][x]=(x>=s0&&x<s0+w0); if(cells[y][x])total++;}}
      function P(px,py){return dir?[py,px]:[px,py];}

      /* だんで 分ける */
      var band=[];
      for(y=0;y<H;y++){
        var w1=widths[y], s1=(W-w1)/2;
        var col=(kind==='even')?(y<3?'a':'b'):(y<3?'a':(y===3?'c':'b'));
        var p1=P(s1,y), p2=P(s1+w1-1,y);
        band.push({t:'cap',x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],c:col});
      }
      var bandExp=(kind==='even')?'（2＋4＋6）×2':'（1＋3＋5）×2＋7';
      var bandName=dir?'たての れつで 分ける':'よこの だんで 分ける';

      /* ななめに 線を ひく */
      var g={},keys=[];
      for(y=0;y<H;y++)for(x=0;x<W;x++) if(cells[y][x]){
        var k=x+y; if(!g[k]){g[k]=[];keys.push(k);} g[k].push([x,y]);
      }
      keys.sort(function(p,q){return p-q;});
      var L1=g[keys[0]].length, n1=0, L2=0, n2=0, diag=[];
      keys.forEach(function(k){
        var arr=g[k].slice().sort(function(p,q){return p[1]-q[1];});
        var len=arr.length;
        if(len===L1) n1++; else {L2=len; n2++;}
        var a1=P(arr[0][0],arr[0][1]), a2=P(arr[len-1][0],arr[len-1][1]);
        diag.push({t:'cap',wf:0.70,x1:a1[0],y1:a1[1],x2:a2[0],y2:a2[1],c:(len===L1?'a':'b')});
      });
      var diagExp=L1+'×'+n1+'＋'+L2+'×'+n2;

      /* 動かして 長方形（正方形）に する */
      var rx,ry,rw,rh,mv;
      if(kind==='even'){ rx=0;ry=1;rw=6;rh=4;
        mv=[[2,0,0,1],[3,0,5,1],[2,5,0,4],[3,5,5,4]];
      }else{ rx=1;ry=1;rw=5;rh=5;
        mv=[[3,0,1,1],[6,3,5,1],[3,6,5,5],[0,3,1,5]];
      }
      var R = dir?{x:ry,y:rx,w:rh,h:rw}:{x:rx,y:ry,w:rw,h:rh};
      var moves=mv.map(function(m){
        var a=P(m[0],m[1]),b=P(m[2],m[3]);
        return [a[0],a[1],b[0],b[1]];
      });
      var gh=[];
      for(y=R.y;y<R.y+R.h;y++)for(x=R.x;x<R.x+R.w;x++) if(!cells[y][x]) gh.push([x,y]);
      var rectExp=R.w+'×'+R.h;
      var rectName=(kind==='even')?'動かして 長方形に する':'動かして 正方形に する';

      return {W:W,H:H,cells:cells,total:total,E:[
        {exp:bandExp,name:bandName,shapes:band},
        {exp:diagExp,name:'ななめに 線を ひく',shapes:diag},
        {exp:rectExp,name:rectName,ghosts:gh,moves:moves,
         shapes:[{t:'rect',x:R.x,y:R.y,w:R.w,h:R.h,c:'c'}]}
      ]};
    }

    function make(){
      var t=ri(0,2);
      if(t===0) return figL();
      return figDia(t===1?'even':'odd', ri(0,1));
    }

    /* ===== 図を えがく ===== */
    function svg(f,E){
      var s=22,pad=12,W=f.W,H=f.H,x,y;
      var vw=W*s+pad*2, vh=H*s+pad*2, o='';
      function CX(v){return pad+v*s+s/2;}
      function CY(v){return pad+v*s+s/2;}
      o+='<svg viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
      ((E&&E.shapes)||[]).forEach(function(sh){
        var c=COL[sh.c];
        if(sh.t==='rect'){
          o+='<rect x="'+(pad+sh.x*s+2)+'" y="'+(pad+sh.y*s+2)+'" width="'+(sh.w*s-4)+
             '" height="'+(sh.h*s-4)+'" rx="8" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="2.4"'+
             (sh.c==='x'?' stroke-dasharray="5 4"':'')+'/>';
        }else{
          var x1=CX(sh.x1),y1=CY(sh.y1),x2=CX(sh.x2),y2=CY(sh.y2);
          var ow=s*(sh.wf||0.94), iw=ow-3.8;
          o+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c.s+
             '" stroke-width="'+ow+'" stroke-linecap="round"/>';
          o+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#fff" stroke-width="'+
             iw+'" stroke-linecap="round"/>';
          o+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c.f+
             '" stroke-width="'+iw+'" stroke-linecap="round"/>';
        }
      });
      var ghost={};
      if(E&&E.ghosts) E.ghosts.forEach(function(p){ghost[p[0]+','+p[1]]=1;});
      for(y=0;y<H;y++)for(x=0;x<W;x++){
        if(f.cells[y][x])
          o+='<circle cx="'+CX(x)+'" cy="'+CY(y)+'" r="6" fill="'+DOT+'"/>';
        else if((E&&E.ghostAll)||ghost[x+','+y])
          o+='<circle cx="'+CX(x)+'" cy="'+CY(y)+'" r="6" fill="#fff" stroke="#b9c8d6" stroke-width="1.7" stroke-dasharray="3 3"/>';
      }
      ((E&&E.moves)||[]).forEach(function(m){
        var ax=CX(m[0]),ay=CY(m[1]),bx=CX(m[2]),by=CY(m[3]);
        var dx=bx-ax,dy=by-ay,d=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/d,uy=dy/d,r=11;
        var sx=ax+ux*r, sy=ay+uy*r, ex=bx-ux*r, ey=by-uy*r;
        var mx=(sx+ex)/2, my=(sy+ey)/2;
        var cx=mx-uy*d*0.22, cy=my+ux*d*0.22;
        var hx=ex-cx, hy=ey-cy, hl=Math.sqrt(hx*hx+hy*hy)||1; hx/=hl; hy/=hl;
        var t1=5.4;
        o+='<path d="M'+sx+','+sy+' Q'+cx+','+cy+' '+ex+','+ey+'" fill="none" stroke="'+RED+'" stroke-width="2.1"/>';
        o+='<polygon points="'+ex+','+ey+' '+(ex-hx*t1-hy*t1*0.62)+','+(ey-hy*t1+hx*t1*0.62)+
           ' '+(ex-hx*t1+hy*t1*0.62)+','+(ey-hy*t1-hx*t1*0.62)+'" fill="'+RED+'"/>';
        o+='<circle cx="'+ax+'" cy="'+ay+'" r="9.2" fill="none" stroke="'+RED+'" stroke-width="2"/>';
      });
      return o+'</svg>';
    }

    /* ===== 出題 ===== */
    function build(newFig){
      if(newFig||!z) z=make();

      qOrder=[0,1,2];

    document.getElementById('zuNew').addEventListener('click',function(){build(true);});
    document.getElementById('zuAgain').addEventListener('click',function(){build(false);});

  /* 半角の式を 計算する。おかしければ null。
     trace に 途中の 計算の 答えを 入れて かえす（けんしょう用） */
  function evalSrc(s,trace){
    var at=parse(s),g=0;
    if(!at.length) return null;
    var d=0,i;
    for(i=0;i<s.length;i++){ if(s.charAt(i)==='(')d++; else if(s.charAt(i)===')'){d--; if(d<0) return null;} }
    if(d!==0) return null;
    function tidy(){
      for(var j=0;j<at.length;j++){
        if(at[j].t==='l'&&at[j+1]&&at[j+1].t==='n'&&at[j+2]&&at[j+2].t==='r'){
          at.splice(j,3,at[j+1]); j=-1;
        }
      }
    }
    tidy();
    while(at.length>1){
      if(g++>40) return null;
      var k=nextOp(at);
      if(k<0) return null;
      var a=k-1,b=k+1;
      if(!at[a]||at[a].t!=='n'||!at[b]||at[b].t!=='n') return null;
      var v=calc(at[a].v,at[k].v,at[b].v);
      if(!isFinite(v)) return null;
      if(trace) trace.push(v);
      at.splice(a,3,{t:'n',v:v,pc:false});
      tidy();
    }
    return (at.length===1&&at[0].t==='n')?at[0].v:null;
  }

  /* かけ算の じゅんじょを きびしく 見るときは true

              {s:'。'},

    if(t===5){                    /* ● ＋ ● × ●  （　）は いらない */
      pair=R_SHOP[ri(0,R_SHOP.length-1)];

      ok=[];
      mulOK(b,c).forEach(function(m){ok.push(a+'+'+m);ok.push(m+'+'+a);});
      return {t:t,ok:ok,ans:a+b*c,unit:'円',

        tip:'かけ算の ところは、（　）が なくても 先に 計算するよ。',

    if(t===6){                    /* ● － ● × ●  （　）は いらない */

    /* t===7  ● × ● ＋ ● × ●  （　）は いらない */
    pair=R_SHOP[ri(0,R_SHOP.length-1)];
    a=10*ri(3,9); b=ri(2,6); c=10*ri(3,9); d=ri(2,6);

  }

  /* 位置つきで 式を 区切る（ヒントの 下線に つかう） */
  function tokPos(s){
    var out=[],i=0;
    while(i<s.length){
      var c=s.charAt(i);
      if(c>='0'&&c<='9'){var j=i;while(j<s.length&&s.charAt(j)>='0'&&s.charAt(j)<='9')j++;
        out.push({t:'n',v:parseInt(s.slice(i,j),10),a:i,b:j-1});i=j;}
      else if(OPCH[c]){out.push({t:'o',v:OPCH[c],a:i,b:i});i++;}
      else if(c==='('){out.push({t:'l',a:i,b:i});i++;}
      else if(c===')'){out.push({t:'r',a:i,b:i});i++;}
      else i++;
    }
    return out;
  }

  RPanel.prototype.reset=function(prob){
    var self=this;
    (this.timers||[]).forEach(clearTimeout); this.timers=[];
    CH.newProblem();
    this.prob=prob||ritsuGen();
    this.exp=''; this.buf=''; this.stage='shiki'; this.done=false; this.hinted=false;

    var html='';
    this.prob.text.forEach(function(p){
      var t=String(p.s).replace(/(\d+)/g,'<b>$1</b>');
      if(p.br) html+='<br>';
      html+= p.hi ? '<span class="hi">'+t+'</span>' : t;
    });
    this.qEl.innerHTML=html;

    this.expEl.className='rexp';
    this.boxEl.className='rbox';
    this.kotaeLine.classList.add('off');
    this.unitEl.textContent=this.prob.unit;
    this.kTitle.textContent='しきを 書こう';
    this.dimOps(false);
    this.keypad.classList.remove('off');
    this.againBtn.classList.remove('on');

    if(!this.hana){
      this.hana=document.createElement('img');
      this.hana.src=document.getElementById('hanamaruSrc').src;
      this.paper.appendChild(this.hana);
    }

    this.say('もんだいを 読んで、1つの しきに 書こう。','');
    this.render();
    this.layout();

  RPanel.prototype.dimOps=function(on){
    var self=this;
    ['add','sub','mul','div','lp','rp'].forEach(function(k){
      self.keyEl[k].classList.toggle('dim',!!on);
    });
  };
  RPanel.prototype.depth=function(){
    var d=0;
    for(var i=0;i<this.exp.length;i++){
      var c=this.exp.charAt(i);
      if(c==='(')d++; else if(c===')')d--;
    }
    return d;
  };

  /* しきを えがく（記号は 高さを そろえる） */
  RPanel.prototype.render=function(){
    var e=this.expEl,i,ch,sp;
    e.innerHTML='';
    for(i=0;i<this.exp.length;i++){
      ch=this.exp.charAt(i);
      sp=document.createElement('span');
      sp.setAttribute('data-i',i);
      if(OPCH[ch]){
        sp.className='rch tk op'; sp.textContent=OPCH[ch];
        sp.setAttribute('data-op',OPCH[ch]);
        if(OPDY[OPCH[ch]]) sp.style.transform='translateY('+OPDY[OPCH[ch]].toFixed(4)+'em)';
      }else if(ch==='('||ch===')'){
        sp.className='rch tk paren'; sp.textContent=(ch==='('?'（':'）');
      }else{
        sp.className='rch'; sp.textContent=ch;
      }
      e.appendChild(sp);
    }
    if(this.stage==='shiki'){
      var c=document.createElement('span'); c.className='caret'; e.appendChild(c);
    }
    this.keyEl.rp.classList.toggle('want',this.stage==='shiki'&&this.depth()>0);

    this.boxEl.innerHTML='';
    if(this.stage!=='shiki'){
      this.boxEl.appendChild(document.createTextNode(this.buf));
      if(!this.done){
        var c2=document.createElement('span'); c2.className='caret'; this.boxEl.appendChild(c2);
      }
    }
  };

  RPanel.prototype.press=function(k){
    if(this.done) return;
    if(k==='del'){
      if(this.stage==='shiki'){ this.exp=this.exp.slice(0,-1); }
      else { this.buf=this.buf.slice(0,-1); }
      this.clearUl(); this.render(); this.layout(); return;
    }
    if(k==='enter'){
      if(this.stage==='shiki') this.checkShiki(); else this.checkKotae();
      return;
    }
    if(this.stage==='kotae'){
      if(RSRC[k]) return;
      if(this.buf.length>=6) return;
      if(this.buf===''&&k==='0'&&String(this.prob.ans)!=='0') return;
      this.buf+=k; this.render();
      if(this.buf.length>=String(this.prob.ans).length) this.checkKotae();
      return;
    }
    /* ---- しき の 入力 ---- */
    var last=this.exp.slice(-1), isNum=(last>='0'&&last<='9');
    if(k>='0'&&k<='9'){
      if(this.exp.length>=16) return;
      if(k==='0'&&!isNum) return;            /* 0 から はじまる 数は 書かない */
      this.exp+=k;
    }else if(RSRC[k]){
      var ch=RSRC[k];
      if(ch==='('){
        if(this.exp!==''&&'+-*/'.indexOf(last)<0) return;
        if(this.depth()>0) return;            /* （　）の 中の （　）は つかわない */
        this.exp+='(';
      }else if(ch===')'){
        if(this.depth()<=0){ ngBlip(); this.say('先に （ を 打ってから ） を 打とう。','bad'); return; }
        if(!isNum) return;
        this.exp+=')';
      }else{
        if(!isNum&&last!==')') return;
        this.exp+=ch;
      }
    }else return;
    this.clearUl(); this.render(); this.layout();
  };

  RPanel.prototype.clearUl=function(){
    var l=this.expEl.querySelectorAll('.ul');
    for(var i=0;i<l.length;i++) l[i].classList.remove('ul');
  };
  RPanel.prototype.shake=function(el,msg){
    ngBlip(); this.say(msg,'bad');
    el.classList.add('ng');
    setTimeout(function(){el.classList.remove('ng');},460);
  };

  RPanel.prototype.checkShiki=function(){
    var s=this.exp;
    if(!s){ this.say('もんだいを 読んで、しきを 書いて みよう。','bad'); ngBlip(); return; }
    if(this.depth()!==0){ this.shake(this.expEl,'（ と ） の かずが あって いないよ。'); return; }
    if('+-*/('.indexOf(s.slice(-1))>=0){ this.shake(this.expEl,'しきが とちゅうだよ。'); return; }
    if(this.prob.ok.indexOf(s)>=0){
      okBlip();
      this.expEl.classList.add('ok');
      this.stage='kotae';
      this.kotaeLine.classList.remove('off');
      this.kTitle.textContent='こたえを 書こう';
      this.dimOps(true);
      this.hinted=false;
      this.say('しきは せいかい！　つぎは 計算して こたえを 書こう。','good');
      this.render(); this.layout();
      return;
    }
    CH.miss();
    var v=evalSrc(s);
    if(v!==null&&v===this.prob.ans){
      this.shake(this.expEl,'こたえは あって いるね。でも、もんだいの ばめんを そのまま 1つの しきに 書いて みよう。');
    }else{
      this.shake(this.expEl,'もう一度 考えて みよう。'+this.prob.tip);
    }
  };

  RPanel.prototype.checkKotae=function(){
    var self=this;
    if(this.buf==='') return;
    if(parseInt(this.buf,10)===this.prob.ans){
      this.done=true;
      this.boxEl.classList.add('ok');
      this.keypad.classList.add('off');
      this.render();
      this.say('せいかい！　'+this.expShow()+' ＝ '+this.prob.ans+this.prob.unit,'good',true);
      this.stamp();
      pinponPlay();
      CH.done();
      this.timers.push(setTimeout(function(){ self.hana.className='khana fade'; },2000));
      if(!CH.stay()) this.timers.push(setTimeout(function(){ self.reset(); },3000));
    }else{
      CH.miss();
      this.shake(this.boxEl,'計算を もう一度 たしかめて みよう。');
      setTimeout(function(){ self.buf=''; self.render(); },460);
    }
  };
  RPanel.prototype.expShow=function(){
    var s='';
    for(var i=0;i<this.exp.length;i++){
      var c=this.exp.charAt(i);
      s+= OPCH[c]||(c==='('?'（':c===')'?'）':c);
    }
    return s;
  };

  RPanel.prototype.showHint=function(){
    if(this.done) return;
    if(this.stage==='shiki'){
      var l=this.qEl.querySelectorAll('.hi'),i;
      for(i=0;i<l.length;i++) l[i].classList.add('on');
      this.say(this.prob.hint,'good');
      return;
    }
    var at=tokPos(this.exp), k=nextOp(at);
    if(k>0&&at[k-1]&&at[k+1]){
      var a=at[k-1].a, b=at[k+1].b, sp=this.expEl.querySelectorAll('.rch');
      for(var j=0;j<sp.length;j++){
        var idx=parseInt(sp[j].getAttribute('data-i'),10);
        sp[j].classList.toggle('ul',idx>=a&&idx<=b);
      }
      this.say('赤い 線の ところから 先に 計算するよ。','good');
    }else{
      this.say('ひっ算で 計算して みよう。','good');
    }
  };

  RPanel.prototype.stamp=function(){
    var pw=this.paper.clientWidth, ph=this.paper.clientHeight;
    this.hana.style.width=(Math.min(pw,ph)*0.62)+'px';
    this.hana.style.left=(pw/2)+'px';
    this.hana.style.top=(ph/2)+'px';
    this.hana.className='khana show';
  };
  RPanel.prototype.say=function(text,kind,again){
    this.msg.className='msg'+(kind?' '+kind:'');
    this.badge.textContent=kind==='good'?'いいね':(kind==='bad'?'ざんねん':'しき');
    this.mtext.textContent=text;
    this.againBtn.classList.toggle('on',!!again);
  };
  RPanel.prototype.layout=function(){
    var P=this.paper,W=P.clientWidth,H=P.clientHeight;
    if(!W||!H) return;
    var size=Math.min(W/30,H/19);
    size=Math.max(10,Math.min(30,size));
    this.sheet.style.fontSize=size+'px';
    var g=0;
    while(g++<26&&size>9&&(this.inner.offsetHeight>H||this.inner.scrollWidth>W)){
      size*=0.955; this.sheet.style.fontSize=size+'px';
    }
  };

  /* =========================================================
     まちがい探しタブ ― 友だちの ノートの まちがいを 見つける
     ---------------------------------------------------------
     L … 友だちの ノート（1行目は もとの しき。bad の 行が まちがい）
     F … ただしい ときかた（行数は L と そろえる）
     行は 文字列か、[{s:'…'},{s:'…',u:1}] の 形（u:1 が ヒントの 赤い下線）
     ========================================================= */
  function machiGen(){
    var W=[0,0,0,1,1,1,2,2,2,3,3,3,4,4,4,5,5,6,6], t=W[ri(0,W.length-1)];
    var a,b,c,q,n;
    if(t===0){                       /* ●＋●×● を 前から 計算した */
      c=ri(2,9); b=ri(11,19); a=10*ri(1,9);
      return {head:a+'＋'+b+'×'+c, ans:a+b*c, first:b+'×'+c, bad:1,
        L:[[{s:a+'＋'},{s:b+'×'+c,u:1}], '＝'+(a+b)+'×'+c, '＝'+((a+b)*c)],
        F:[a+'＋'+b+'×'+c, '＝'+a+'＋'+(b*c), '＝'+(a+b*c)],
        why:'＋と ×の ある しきは、×を 先に 計算するよ。'};
    }
    if(t===1){                       /* ●－●×● を 前から 計算した */
      c=ri(2,5); b=ri(11,25); a=b*c+10*ri(1,9);
      return {head:a+'－'+b+'×'+c, ans:a-b*c, first:b+'×'+c, bad:1,
        L:[[{s:a+'－'},{s:b+'×'+c,u:1}], '＝'+(a-b)+'×'+c, '＝'+((a-b)*c)],
        F:[a+'－'+b+'×'+c, '＝'+a+'－'+(b*c), '＝'+(a-b*c)],
        why:'－と ×の ある しきは、×を 先に 計算するよ。'};
    }
    if(t===2){                       /* ●－（●＋●）の（　）を 先に しなかった */
      b=10*ri(2,8); c=10*ri(1,8); a=b+c+10*ri(1,9);
      return {head:a+'－（'+b+'＋'+c+'）', ans:a-b-c, first:b+'＋'+c, bad:1,
        L:[[{s:a+'－'},{s:'（'+b+'＋'+c+'）',u:1}], '＝'+(a-b)+'＋'+c, '＝'+(a-b+c)],
        F:[a+'－（'+b+'＋'+c+'）', '＝'+a+'－'+(b+c), '＝'+(a-b-c)],
        why:'（　）の 中を いちばん 先に 計算するよ。'};
    }
    if(t===3){                       /* ●－●＋● を 右から 計算した */
      b=ri(11,49); c=ri(11,49); a=b+c+10*ri(1,9);
      return {head:a+'－'+b+'＋'+c, ans:a-b+c, first:a+'－'+b, bad:1,
        L:[[{s:a+'－'+b,u:1},{s:'＋'+c}], '＝'+a+'－'+(b+c), '＝'+(a-b-c)],
        F:[a+'－'+b+'＋'+c, '＝'+(a-b)+'＋'+c, '＝'+(a-b+c)],
        why:'＋と －だけの しきは、左から じゅんに 計算するよ。'};
    }
    if(t===4){                       /* ●÷●×● を 右から 計算した */
      do{ b=ri(2,9); c=ri(2,4); q=ri(2,9); }while(b*c*q>240);
      a=b*c*q;
      return {head:a+'÷'+b+'×'+c, ans:(a/b)*c, first:a+'÷'+b, bad:1,
        L:[[{s:a+'÷'+b,u:1},{s:'×'+c}], '＝'+a+'÷'+(b*c), '＝'+q],
        F:[a+'÷'+b+'×'+c, '＝'+(a/b)+'×'+c, '＝'+((a/b)*c)],
        why:'×と ÷だけの しきは、左から じゅんに 計算するよ。'};
    }
    if(t===5){                       /* （●＋●）×● で 片方だけ かけた */
      a=10*ri(1,9); b=ri(2,9); c=ri(2,9);
      return {head:'（'+a+'＋'+b+'）×'+c, ans:(a+b)*c, first:a+'＋'+b, bad:1,
        L:[[{s:'（'+a+'＋'+b+'）',u:1},{s:'×'+c}], '＝'+a+'×'+c+'＋'+b, '＝'+(a*c+b)],
        F:['（'+a+'＋'+b+'）×'+c, '＝'+(a+b)+'×'+c, '＝'+((a+b)*c)],
        why:'（　）の 中を 先に 計算するよ。ばらして 計算する ときは、'+b+'にも ×'+c+'が かかるよ。'};
    }
    /* t===6  99×● を （100－●）×● に した ときの まちがい */
    a=ri(1,4); b=ri(3,9); n=100-a;
    return {head:n+'×'+b, ans:n*b, first:'100×'+b, bad:2,
      L:[n+'×'+b, [{s:'＝'},{s:'（100－'+a+'）',u:1},{s:'×'+b}],
         '＝100×'+b+'－'+a, '＝'+(100*b-a)],
      F:[n+'×'+b, '＝（100－'+a+'）×'+b, '＝100×'+b+'－'+a+'×'+b, '＝'+(n*b)],
      why:'（　）の 中の 100にも '+a+'にも、×'+b+'が かかるよ。'};
  }

  /* 1行 えがく（文字列でも、[{s:…,u:1},…] でも よい） */
  MPanel.prototype.row=function(parent,row,cls){
    var self=this;
    var d=document.createElement('div'); d.className='kline'+(cls?' '+cls:'');
    var parts=(typeof row==='string')?[{s:row}]:row;
    parts.forEach(function(p){
      var g=document.createElement('span'); g.className='kseg'+(p.u?' mu':'');
      self.text(g,String(p.s)); d.appendChild(g);
    });

  MPanel.prototype.reset=function(prob){
    var self=this;
    (this.timers||[]).forEach(clearTimeout); this.timers=[];
    CH.newProblem();
    this.prob=prob||machiGen();
    this.stage='find'; this.buf=''; this.done=false;
    var P=this.prob;
    this.leftEl.innerHTML='<div class="mcap">友だちの ノート</div>';
    this.rightEl.innerHTML='<div class="mcap">ただしい ときかた</div>';
    this.rows=[];
    P.L.forEach(function(r,i){
      var d=self.row(self.leftEl,r,'mrow'+(i>0?' pick':''));
      var x=document.createElement('span'); x.className='mx'; x.textContent='✗';
      d.appendChild(x);                       /* 場所だけ 先に とっておく */
      d.addEventListener('click',function(){self.pick(i,d);});
      self.rows.push(d);
    });
    this.fixRows=[];
    P.F.forEach(function(r,i){
      /* さいごの 行（こたえ）だけは、こたえを 書くまで かくして おく */
      self.fixRows.push(self.row(self.rightEl,r,'mfix'+(i===P.F.length-1?' mhide':'')));
    });
    this.rightEl.classList.remove('on');
    this.ansLine.classList.remove('on');
    this.waitNext=false;
    this.nextBtn.classList.remove('on');
    this.boxEl.className='kblank mbox';
    this.boxEl.style.width=(String(P.ans).length*0.62+1.05)+'em';
    this.boxEl.innerHTML='';
    this.keypad.classList.add('off');
    this.againBtn.classList.remove('on');
    if(!this.hana){
      this.hana=document.createElement('img');
      this.hana.src=document.getElementById('hanamaruSrc').src;
      this.paper.appendChild(this.hana);
    }
    this.hana.className='khana';
    this.say('友だちの ノートに まちがいが あるよ。はじめに まちがえた 行を えらぼう。','');
    this.layout();
  };
  /* こたえた あとは じどうで 進まない（「つぎの もんだい」ボタン 待ち） */
  MPanel.prototype.nextProblem=function(){ if(!this.waitNext) this.reset(); };

  /* ---------- まちがえた 行を えらぶ ---------- */
  MPanel.prototype.pick=function(i,d){
    var self=this;
    if(this.stage!=='find') return;
    if(i===0){
      ngBlip();
      this.say('1行目は もんだいの しきだよ。その 下から さがそう。','bad');
      return;
    }
    if(i===this.prob.bad){
      okBlip();
      d.classList.remove('pick'); d.classList.add('bad');
      this.rows.forEach(function(r){r.classList.remove('pick');});
      this.stage='ans';
      this.rightEl.classList.add('on');      /* ただしい ときかたを 見せる */
      this.ansLine.classList.add('on');
      this.keypad.classList.remove('off');
      this.render();
      this.say('そこだね！　'+this.prob.why+'　右の ときかたを 見て、こたえを 出そう。','good');
      this.layout();
    }else{
      CH.miss();
      ngBlip(); d.classList.add('ng');
      this.say('その 行は あって いるよ。上から 1行ずつ たしかめて みよう。','bad');
      setTimeout(function(){d.classList.remove('ng');},460);
    }
  };

  /* ---------- こたえを 書く ---------- */
  MPanel.prototype.render=function(){
    this.boxEl.innerHTML='';
    if(this.stage==='find') return;
    this.boxEl.appendChild(document.createTextNode(this.buf));
    if(!this.done){
      var c=document.createElement('span'); c.className='caret'; this.boxEl.appendChild(c);
    }
  };
  MPanel.prototype.press=function(k){
    if(this.done||this.stage!=='ans') return;
    if(k==='del'){this.buf=this.buf.slice(0,-1);this.render();return;}
    if(k==='enter'){this.check();return;}
    if(this.buf.length>=5) return;
    if(this.buf==='0')this.buf='';
    this.buf+=k; this.render();
    if(this.buf.length>=String(this.prob.ans).length) this.check();
  };
  MPanel.prototype.check=function(){
    if(this.buf==='') return;
    var self=this;
    if(parseInt(this.buf,10)===this.prob.ans){
      this.done=true; this.waitNext=true; this.buf=String(this.prob.ans);
      this.boxEl.classList.add('ok'); this.render();
      this.rightEl.classList.add('on');
      if(this.fixRows&&this.fixRows.length)
        this.fixRows[this.fixRows.length-1].classList.remove('mhide');
      this.keypad.classList.add('off');
      this.say('せいかい！　'+this.prob.head+' ＝ '+this.prob.ans,'good',true);
      this.stamp();
      pinponPlay();
      CH.done();
      this.layout();
      this.timers.push(setTimeout(function(){ self.hana.className='khana fade'; },2000));
      /* はなまるが 消えたら とまって、ボタンで つぎへ */
      this.timers.push(setTimeout(function(){
        if(!CH.test()) self.nextBtn.classList.add('on');   /* テスト中は じどうで つぎの 大問へ */
      },2500));
    }else{
      CH.miss();
      ngBlip(); this.boxEl.classList.add('ng');
      this.say('もう一度 計算して みよう。'+this.prob.why,'bad');
      setTimeout(function(){self.boxEl.classList.remove('ng');self.buf='';self.render();},460);
    }
  };

  MPanel.prototype.showHint=function(){
    if(this.done) return;
    if(this.stage==='find'){
      var l=this.leftEl.querySelectorAll('.mu'),i;
      for(i=0;i<l.length;i++) l[i].classList.add('on');
      this.say('赤い 線の ところに 気を つけて、上から 1行ずつ たしかめて みよう。','good');
    }else{
      this.say('まず 「'+this.prob.first+'」 から 計算しよう。','good');
    }
  };
  MPanel.prototype.stamp=function(){
    var pw=this.paper.clientWidth, ph=this.paper.clientHeight;
    this.hana.style.width=(Math.min(pw,ph)*0.62)+'px';
    this.hana.style.left=(pw/2)+'px';
    this.hana.style.top=(ph/2)+'px';
    this.hana.className='khana show';
  };
  MPanel.prototype.say=function(text,kind,again){
    this.msg.className='msg'+(kind?' '+kind:'');
    this.badge.textContent=kind==='good'?'いいね':(kind==='bad'?'ざんねん':'さがそう');
    this.mtext.textContent=text;
    this.againBtn.classList.toggle('on',!!again);
  };
  MPanel.prototype.layout=function(){
    var sh=this.sheet,W=this.paper.clientWidth-40,H=this.paper.clientHeight-40;
    if(W<20||H<20) return;          /* まだ 画面に 出て いない ときは 何もしない */
    var w=sh.offsetWidth,h=sh.offsetHeight;
    var k=Math.min(W/Math.max(1,w),H/Math.max(1,h));
    if(k>2.4)k=2.4;
    this.k=k;
    sh.style.transform='translate(-50%,-50%) scale('+k+')';
  };


  /* ---- 10問チャレンジ用：「つぎの もんだい」 ---- */
  Panel.prototype.nextProblem=function(){
    this.reset(this.def.gen?this.def.gen():this.def.src);
  };
  KPanel.prototype.nextProblem=function(){ this.reset(); };
  SPanel.prototype.nextProblem=function(){ this.reset(); };
  RPanel.prototype.nextProblem=function(){ this.reset(); };
  /* テストの 練習で 大問を 開く ときの「まっさらな 1問」 */
  Panel.prototype.fresh=Panel.prototype.nextProblem;
  KPanel.prototype.fresh=function(){ this.reset(); };
  SPanel.prototype.fresh=function(){ this.reset(); };
  RPanel.prototype.fresh=function(){ this.reset(); };
  MPanel.prototype.fresh=function(){ this.reset(); };

  /* =========================================================
     タブ
     ========================================================= */
  var tabsEl=document.getElementById('tabs'),panelsEl=document.getElementById('panels');
  var panels={},tabBtns={},order=[];
  PROBLEMS.forEach(function(def){
    var p=new Panel(def);
    panelsEl.insertBefore(p.el,panelsEl.firstChild);
    panels[def.key]=p;
  });
  var kp=new KPanel();
  panelsEl.appendChild(kp.el);
  panels['kufuu']=kp;
  var sp=new SPanel();
  panelsEl.appendChild(sp.el);
  panels['seishitsu']=sp;
  var rp=new RPanel();
  panelsEl.appendChild(rp.el);
  panels['ritsu']=rp;
  var mp=new MPanel();
  panelsEl.appendChild(mp.el);
  panels['machigai']=mp;
  panels['think']=ZU;
  PROBLEMS.map(function(d){return {key:d.key,label:d.label};})
    .concat(DOCS.map(function(d){return {key:d.key,label:d.label};}))
    .forEach(function(t){
      var b=document.createElement('button');
      b.className='tab';b.textContent=t.label;
      b.addEventListener('click',function(){show(t.key);});
      tabsEl.appendChild(b);tabBtns[t.key]=b;order.push(t.key);
    });

  var current=null;
  function show(key){
    current=key;
    if(CH.isOn()) CH.reset();          /* タブを かえたら 10問チャレンジは 数えなおす */
    order.forEach(function(k){
      tabBtns[k].classList.toggle('on',k===key);
      var el=document.querySelector('.panel[data-tab="'+k+'"]');
      if(el) el.classList.toggle('on',k===key);
    });
    if(panels[key]) setTimeout(function(){panels[key].layout();},0);
  }

  var RKEYMAP={'+':'add','-':'sub','*':'mul','/':'div','(':'lp',')':'rp'};
  document.addEventListener('keydown',function(e){
    var p=panels[current];if(!p)return;
    if(e.key>='0'&&e.key<='9')p.press(e.key);
    else if(e.key==='Backspace'){p.press('del');e.preventDefault();}
    else if(e.key==='Enter')p.press('enter');
    else if(p.acceptsOps&&RKEYMAP[e.key]){p.press(RKEYMAP[e.key]);e.preventDefault();}
  });
  document.getElementById('resetBtn').addEventListener('click',function(){
    if(CH.isOn()) CH.reset();
    if(panels[current])panels[current].reset();
  });
  window.addEventListener('resize',function(){if(panels[current])panels[current].layout();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){
    measureOps(); applyOpDY();
    if(panels[current])panels[current].layout();
  });

  /* =========================================================
     📝 テストの 練習
     ---------------------------------------------------------
     決めた じゅんに タブを 1問ずつ 開いて、さいごに 大問ごとの
     けっか（ノーミス／まちがい○回／とばした・💡）を 出す。
     ========================================================= */

  /* ---------- ①せってい（ここだけ 直せば よい）----------
     no  … 帯と けっかに 出る 番号（'大問1' など。数字だけなら「1問め」と 出る）
     tab … 開く タブ（'q1' 'q2' 'q3' 'think' 'kufuu' 'seishitsu' 'ritsu' 'machigai'）
     name… けっかに 出す 名前（書かなければ タブの 名前）                      */
  var TEST_SETTEI={
    button:'📝 テストの 練習',
    tests:[
      {title:'計算のきまり テスト', items:[
        {no:'大問1',tab:'q1'},
        {no:'大問2',tab:'q2'},
        {no:'大問3',tab:'q3'},
        {no:'大問4',tab:'think', name:'●の数の もとめ方'},
        {no:'大問5',tab:'kufuu'},
        {no:'大問6',tab:'seishitsu'},
        {no:'大問7',tab:'ritsu', name:'しきに 書く'},
        {no:'大問8',tab:'machigai'} ]},
      {title:'計算の じゅんじょ テスト', items:[
        {no:'1',tab:'q1'},
        {no:'2',tab:'q2'},
        {no:'3',tab:'q3'},
        {no:'4',tab:'machigai'} ]},
      {title:'くふうと しきの テスト', items:[
        {no:'1',tab:'kufuu'},
        {no:'2',tab:'seishitsu'},
        {no:'3',tab:'ritsu', name:'しきに 書く'} ]}
    ]
  };

  /* ---------- ②しくみ ---------- */
  TR=(function(){
    var S=TEST_SETTEI;
    function $(id){ return document.getElementById(id); }

    /* ない タブは とばす */
    var TESTS=[];
    (S.tests||[]).forEach(function(t){
      var items=(t.items||[]).filter(function(it){
        if(it&&panels[it.tab]) return true;
        if(window.console) console.warn('テストの練習：タブ「'+(it&&it.tab)+'」が ないので とばします');
        return false;
      });
      if(items.length) TESTS.push({title:t.title||'テスト',items:items});
    });
    if(!TESTS.length) return null;

    var LABEL={};
    order.forEach(function(k){ LABEL[k]=tabBtns[k]?tabBtns[k].textContent:k; });
    function itemName(it){ return it.name||LABEL[it.tab]||it.tab; }

    var run=null, myTimer=0;
    var WAIT=3500;                /* はなまる（2秒）＋ 消える のを 見てから つぎの 大問へ */

    /* ---- ボタン・メニュー・帯 ---- */
    var mount=document.createElement('div');
    mount.id='test-mount';
    mount.innerHTML=
      '<button class="icon-btn" id="test-btn" type="button">'+(S.button||'📝 テストの 練習')+'</button>'+
      '<div id="test-menu">'+
        TESTS.map(function(t,k){
          return '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>';
        }).join('')+
      '</div>'+
      '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'+
        '<button id="test-skip" type="button">とばす</button>'+
        '<button id="test-stop" type="button">やめる</button></div>';
    var anchor=document.getElementById('chal-mount'),
        header=document.querySelector('header');
    if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(mount,anchor.nextSibling);
    else if(header) header.appendChild(mount);
    else document.body.insertBefore(mount,document.body.firstChild);
    var res=document.createElement('div');
    res.id='test-result';
    document.body.appendChild(res);

    function inside(el,box){ while(el){ if(el===box) return true; el=el.parentNode; } return false; }

    /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
    $('test-btn').addEventListener('click',function(e){
      e.stopPropagation();
      if(TESTS.length===1){ start(0); return; }
      var m=$('test-menu');
      m.classList.toggle('open');
      if(m.classList.contains('open')) placeMenu();
    });
    /* せまい 画面で メニューが 左に はみ出す ときは 画面の 中へ */
    function placeMenu(){
      var m=$('test-menu');
      m.style.left=''; m.style.right='';
      var r=m.getBoundingClientRect(), mr=mount.getBoundingClientRect();
      if(r.left<8){ m.style.right='auto'; m.style.left=(8-mr.left)+'px'; }
    }
    $('test-menu').addEventListener('click',function(e){
      var b=e.target;
      while(b&&b!==this&&b.tagName!=='BUTTON') b=b.parentNode;
      if(!b||b===this) return;
      this.classList.remove('open');
      start(parseInt(b.getAttribute('data-k'),10));
    });
    document.addEventListener('click',function(e){
      if(!inside(e.target,mount)) $('test-menu').classList.remove('open');
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape') $('test-menu').classList.remove('open');
    });
    $('test-stop').addEventListener('click',function(){ stop(); });
    $('test-skip').addEventListener('click',function(){ skip(); });

    /* 💡ヒントを おしたか */
    document.addEventListener('click',function(e){
      if(!run) return;
      var t=e.target;
      while(t&&t!==document){
        if(t.classList&&t.classList.contains('hintbtn')){ api.hint(); return; }
        t=t.parentNode;
      }
    },true);

    /* ---- 中身 ---- */
    function cur(){ return run?run.rec[run.i]:null; }
    function clearMine(){ clearTimeout(myTimer); myTimer=0; }
    function bar(){
      if(!run) return;
      var T=TESTS[run.t], it=T.items[run.i];
      $('test-no').textContent='📝 '+(/^\d+$/.test(it.no)?it.no+'問め':it.no)+
        '（'+(run.i+1)+'／'+T.items.length+'）';
      $('test-dots').textContent=run.rec.map(function(r,i){
        return r.st==='done'?'●':r.st==='skip'?'－':(i===run.i?'◎':'○');
      }).join('');
    }
    function go(i){
      clearMine();
      run.i=i;
      var it=TESTS[run.t].items[i], p=panels[it.tab];
      show(it.tab);
      if(p&&p.fresh) p.fresh();           /* まっさらな 1問を 出す */
      bar();
    }
    function start(t){
      if(window.Challenge10&&Challenge10.isOn()){    /* 10問チャレンジ中なら 切る */
        var cb=$('btn-challenge'); if(cb) cb.click();
      }
      res.classList.remove('show');
      var back=run?run.back:current;
      run={t:t,i:0,back:back,
           rec:TESTS[t].items.map(function(){ return {miss:0,hint:false,st:'todo'}; })};
      document.body.classList.add('testing');
      go(0);
    }
    function next(){
      if(!run) return;
      if(run.i+1<run.rec.length) go(run.i+1); else finish();
    }
    function skip(){
      var r=cur(); if(!r) return;
      if(r.st!=='done') r.st='skip';
      clearMine();
      next();
    }
    function finish(){
      clearMine();
      var T=TESTS[run.t], perfect=0;
      var rows=T.items.map(function(it,i){
        var r=run.rec[i],tx,c;
        if(r.st==='done'&&r.miss===0){ tx='⭕ ノーミス'; c='r-ok'; perfect++; }
        else if(r.st==='done'){ tx='まちがい '+r.miss+'回'; c='r-ng'; }
        else { tx='とばした'; c='r-sk'; }
        return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td>'+
               '<td class="'+c+'">'+tx+'</td><td>'+(r.hint?'💡':'')+'</td></tr>';
      }).join('');
      res.innerHTML='<div class="tr-card">'+
        '<div class="tr-title">📝 '+T.title+'　おわり！</div>'+
        '<table>'+rows+'</table>'+
        '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'+
        '<div class="tr-btns"><button id="test-again" type="button">もう一度</button>'+
        '<button id="test-close" type="button">とじる</button></div></div>';
      res.classList.add('show');
      $('test-again').onclick=function(){ start(run.t); };
      $('test-close').onclick=function(){ stop(); };
      $('test-again').focus();
    }
    /* やめる／とじる：はじめに 開いていた タブへ もどる */
    function stop(){
      if(!run) return;
      var back=run.back;
      run=null;
      clearMine();
      res.classList.remove('show');
      document.body.classList.remove('testing');
      show(back&&panels[back]?back:TESTS[0].items[0].tab);
    }

    var api={
      on:function(){ return !!run; },
      /* 1問 できた → はなまるの あと つぎの 大問へ */
      onDone:function(){
        if(!run||res.classList.contains('show')) return;
        var it=TESTS[run.t].items[run.i], p=panels[it.tab];
        if(p&&p.rest&&p.rest()) return;      /* 考え方タブは 3つ そろって 1つの 大問 */
        var r=cur();
        if(r.st==='todo') r.st='done';
        bar();
        clearMine();
        myTimer=setTimeout(function(){ next(); },WAIT);
      },
      miss:function(){ var r=cur(); if(r&&r.st==='todo') r.miss++; },
      hint:function(){ var r=cur(); if(r&&r.st==='todo') r.hint=true; },
      /* 外から つかう とき用 */
      start:function(t){ start(t||0); },
      skip:function(){ skip(); },
      stop:function(){ stop(); },
      record:function(){ return run?JSON.parse(JSON.stringify(run.rec)):null; }
    };
    window.TestRun=api;
    return api;
  })();


  /* ===== 10問チャレンジ ===== */
  if(window.Challenge10){
    Challenge10.init({
      mount:'#chal-mount',
      total:10,                    /* 5問・20問に したい ときは ここ */
      nextDelay:3000,              /* はなまるから つぎの もんだいまで */
      resultDelay:1500,
      next:function(){ var p=panels[current]; if(p&&p.nextProblem) p.nextProblem(); },
      sound:function(){ okBlip(); },
      record:false,                /* true にすると きょうの 最高記録を のこす */
      recordKey:'keisan-no-kimari'
    });
  }

  show('q1');
})();
</script>
</body>
